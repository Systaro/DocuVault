name: Bug report
description: Something does not work as described
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What did you do, what did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open a space
        2. ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: "`cat .docuvault-current-version` on the server, or the version next to the logo in the app"
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: How is it installed?
      options:
        - docker-compose.product.yml + deploy.sh
        - Local development (docker compose up --build)
        - Other
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: "`docker compose -f docker-compose.product.yml logs backend --tail=100`. Remove hostnames, emails and tokens before pasting."
      render: text
