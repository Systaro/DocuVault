# DocuVault product compose file.
#
# Used to install or operate a DocuVault instance from published images.
# NOT for local development — see docker-compose.yml for that.
#
# Quickstart (see docs/install.md):
#   1. git clone https://github.com/Systaro/DocuVault.git /opt/docuvault
#   2. Copy .env.example.product → .env, fill in values.
#   3. Point your domain (PUBLIC_HOSTNAME) at this server, open ports 80/443.
#   4. Run ./deploy.sh latest   (or a version, e.g. ./deploy.sh v0.7.0)
#
# Image tags are controlled by $DOCUVAULT_VERSION, which deploy.sh sets.
# When invoking docker compose directly:
#   DOCUVAULT_VERSION=v0.7.0 docker compose -f docker-compose.product.yml up -d
#
# Images are public on ghcr.io/systaro/docuvault. Set DOCUVAULT_IMAGE_PREFIX
# in .env to pull them from another registry instead.
#
# TLS:
#   nginx-proxy + acme-companion handle automatic Let's Encrypt certs based
#   on the frontend's VIRTUAL_HOST / LETSENCRYPT_HOST labels. If you have
#   your own reverse proxy (Caddy, Traefik, etc.), comment out the
#   nginx-proxy and acme-companion services and expose the frontend port
#   directly via a `ports:` mapping on the frontend service.
#
# Fresh-install schema bootstrap:
#   db/bootstrap.sql is mounted into postgres' init dir and runs ONCE on
#   first start (when the data volume is empty). On subsequent starts it
#   is ignored. Do NOT change it after first install — schema changes
#   come via image upgrades.

services:
  nginx-proxy:
    image: nginxproxy/nginx-proxy
    container_name: docuvault-nginx-proxy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/tmp/docker.sock:ro
      - nginx_certs:/etc/nginx/certs
      - nginx_vhost:/etc/nginx/vhost.d
      - nginx_html:/usr/share/nginx/html
      - nginx_acme:/etc/acme.sh

  acme-companion:
    image: nginxproxy/acme-companion
    container_name: docuvault-acme
    restart: unless-stopped
    environment:
      DEFAULT_EMAIL: ${LETSENCRYPT_EMAIL:?LETSENCRYPT_EMAIL is required (used for Let's Encrypt expiry notices)}
      NGINX_PROXY_CONTAINER: docuvault-nginx-proxy
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - nginx_certs:/etc/nginx/certs
      - nginx_vhost:/etc/nginx/vhost.d
      - nginx_html:/usr/share/nginx/html
      - nginx_acme:/etc/acme.sh
    depends_on:
      - nginx-proxy

  postgres:
    image: pgvector/pgvector:pg16
    container_name: docuvault-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-docuvault}
      POSTGRES_USER: ${DB_USERNAME:-docuvault}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/bootstrap.sql:/docker-entrypoint-initdb.d/00-bootstrap.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: docuvault-redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: registry.git.systaro.de/systaro-public/container-mirror/minio:RELEASE.2025-09-07T16-13-09Z
    container_name: docuvault-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-docuvault}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    image: ${DOCUVAULT_IMAGE_PREFIX:-ghcr.io/systaro/docuvault}/backend:${DOCUVAULT_VERSION:-latest}
    container_name: docuvault-backend
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${DB_NAME:-docuvault}
      SPRING_DATASOURCE_USERNAME: ${DB_USERNAME:-docuvault}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PASSWORD: ${REDIS_PASSWORD}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-${JWT_SECRET}}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      MAIL_HOST: ${MAIL_HOST:-}
      MAIL_PORT: ${MAIL_PORT:-25}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_SMTP_LOCALHOST: ${MAIL_SMTP_LOCALHOST:-${PUBLIC_HOSTNAME:-localhost}}
      MAIL_FROM_ADDRESS: ${MAIL_FROM_ADDRESS:-noreply@${PUBLIC_HOSTNAME:-localhost}}
      MAIL_FROM_NAME: ${MAIL_FROM_NAME:-}
      PUBLIC_HOSTNAME: ${PUBLIC_HOSTNAME}
      PUBLIC_URL: ${PUBLIC_URL:-https://${PUBLIC_HOSTNAME}}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      # Shared secret the Teams meeting bot authenticates dispatch calls with.
      MEETING_BOT_DISPATCH_TOKEN: ${MEETING_BOT_DISPATCH_TOKEN:-}
      GITLAB_URL: ${GITLAB_URL:-https://gitlab.com}
      GITLAB_TOKEN: ${GITLAB_TOKEN:-}
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-docuvault}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      # Optional central log shipping (logback -> logstash TCP). Disabled by
      # default; set LOGSTASH_DESTINATION=host:port to opt in.
      LOGSTASH_DESTINATION: ${LOGSTASH_DESTINATION:-}
    volumes:
      - repos_data:/data/repos
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy

  frontend:
    image: ${DOCUVAULT_IMAGE_PREFIX:-ghcr.io/systaro/docuvault}/frontend:${DOCUVAULT_VERSION:-latest}
    container_name: docuvault-frontend
    restart: unless-stopped
    environment:
      VIRTUAL_HOST: ${PUBLIC_HOSTNAME:?PUBLIC_HOSTNAME is required (e.g. docuvault.example.com)}
      VIRTUAL_PORT: 80
      LETSENCRYPT_HOST: ${PUBLIC_HOSTNAME}
      LETSENCRYPT_EMAIL: ${LETSENCRYPT_EMAIL}
    expose:
      - "80"
    depends_on:
      - backend

  # Meeting transcription bot (Discord and/or Teams) — opt-in.
  # Activate by:
  #   1) setting OPENAI_API_KEY in .env, plus at least one adapter credential:
  #        DISCORD_BOT_TOKEN          → Discord adapter
  #        MEETING_BOT_DISPATCH_TOKEN → Teams adapter (same value as on backend)
  #   2) running `docker compose --profile meeting-bot up -d`
  # deploy.sh detects either credential and includes this service automatically.
  meeting-bot:
    image: ${DOCUVAULT_IMAGE_PREFIX:-ghcr.io/systaro/docuvault}/meeting-bot:${DOCUVAULT_VERSION:-latest}
    container_name: docuvault-meeting-bot
    restart: unless-stopped
    profiles:
      - meeting-bot
    environment:
      DISCORD_TOKEN: ${DISCORD_BOT_TOKEN:-}
      MEETING_BOT_DISPATCH_TOKEN: ${MEETING_BOT_DISPATCH_TOKEN:-}
      TEAMS_BOT_NAME: ${TEAMS_BOT_NAME:-DocuVault Notetaker}
      MEETING_MAX_CONCURRENT_TEAMS: ${MEETING_MAX_CONCURRENT_TEAMS:-2}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      DOCUVAULT_API_URL: http://backend:7030/api
      TRANSCRIBE_MODEL: ${MEETING_TRANSCRIBE_MODEL:-gpt-4o-transcribe}
      NOTES_MODEL: ${MEETING_NOTES_MODEL:-gpt-5.5}
      # Persist in-progress recordings so a bot restart can finalize them.
      RECORDINGS_DIR: /data/recordings
    volumes:
      - meeting_bot_recordings:/data/recordings
    depends_on:
      - backend

volumes:
  postgres_data:
  repos_data:
  minio_data:
  redis_data:
  meeting_bot_recordings:
  nginx_certs:
  nginx_vhost:
  nginx_html:
  nginx_acme:
