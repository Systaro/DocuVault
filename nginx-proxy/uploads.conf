# Mounted into nginx-proxy's conf.d by docker-compose.product.yml, so it applies
# to every site the proxy serves. nginx accepts 1 MB request bodies by default;
# DocuVault takes files up to 150 MB (spring.servlet.multipart in
# backend/src/main/resources/application.yml) and needs room for the multipart
# overhead. Committing and pushing a large upload can outlast the 60s default.
client_max_body_size 200m;
proxy_read_timeout 300s;
proxy_send_timeout 300s;
