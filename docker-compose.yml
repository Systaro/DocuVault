version: '3.8'

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: docuvault-postgres
    environment:
      POSTGRES_DB: ${DB_NAME:-docuvault}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/src/main/resources/db/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: docuvault-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: docuvault-backend
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${DB_NAME:-docuvault}
      SPRING_DATASOURCE_USERNAME: ${DB_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
      SPRING_DATA_REDIS_HOST: redis
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-${JWT_SECRET}}
      MAIL_HOST: ${MAIL_HOST:-mailrelay.systaro.de}
      MAIL_PORT: ${MAIL_PORT:-25}
      MAIL_USERNAME: ${MAIL_USERNAME}
      MAIL_PASSWORD: ${MAIL_PASSWORD}
      MAIL_SMTP_LOCALHOST: ${MAIL_SMTP_LOCALHOST:-docuvault.systaro.de}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      GITLAB_URL: ${GITLAB_URL:-https://gitlab.com}
      GITLAB_TOKEN: ${GITLAB_TOKEN}
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-docuvault}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-docuvault123}
    ports:
      - "7030:7030"
    volumes:
      - repos_data:/data/repos
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      redis:
        condition: service_healthy

  minio:
    image: minio/minio
    container_name: docuvault-minio
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-docuvault}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-docuvault123}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: docuvault-frontend
    ports:
      - "7031:80"
    depends_on:
      - backend

  # Optional Discord meeting transcription bot.
  # Start with: docker compose --profile meeting-bot up -d
  meeting-bot:
    build:
      context: ./meeting-bot
      dockerfile: Dockerfile
    container_name: docuvault-meeting-bot
    profiles:
      - meeting-bot
    environment:
      DISCORD_TOKEN: ${DISCORD_BOT_TOKEN}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      DOCUVAULT_API_URL: http://backend:7030/api
      TRANSCRIBE_MODEL: ${MEETING_TRANSCRIBE_MODEL:-gpt-4o-transcribe}
      NOTES_MODEL: ${MEETING_NOTES_MODEL:-gpt-5.5}
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  postgres_data:
  repos_data:
  minio_data:
  redis_data:
