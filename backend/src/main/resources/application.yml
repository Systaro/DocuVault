spring:
  application:
    name: docuvault
  datasource:
    url: jdbc:postgresql://localhost:5433/docuvault
    username: ${DB_USERNAME:docuvault}
    password: ${DB_PASSWORD:docuvault}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
    show-sql: false
    open-in-view: false

  session:
    store-type: redis
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}
      password: ${SPRING_DATA_REDIS_PASSWORD:}

  mail:
    host: ${MAIL_HOST:mailrelay.systaro.de}
    port: ${MAIL_PORT:25}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          localhost: ${MAIL_SMTP_LOCALHOST:docuvault.systaro.de}
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000
          starttls:
            enable: false

  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 100MB

server:
  address: 0.0.0.0
  port: 7030
  forward-headers-strategy: native
  servlet:
    context-path: /api
    session:
      cookie:
        name: DOCUVAULT_SESSION
        path: /api
        http-only: true
        same-site: strict
        max-age: 30d
      timeout: 30d

# Encryption key for sensitive settings stored in database
encryption:
  key: ${ENCRYPTION_KEY:${JWT_SECRET:change-me-in-production}}

# OpenAI Configuration
openai:
  api-key: ${OPENAI_API_KEY:}
  embedding-model: text-embedding-3-small
  chat-model: gpt-4o

# GitLab Configuration
gitlab:
  url: ${GITLAB_URL:https://gitlab.com}
  token: ${GITLAB_TOKEN:}

# Admin Configuration
admin:
  email: ${ADMIN_EMAIL:}
  password: ${ADMIN_PASSWORD:}

# MinIO / S3 Configuration
minio:
  endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
  access-key: ${MINIO_ACCESS_KEY:docuvault}
  secret-key: ${MINIO_SECRET_KEY:docuvault123}
  bucket: space-logos

# Git Repository Storage
git:
  repos-path: ${GIT_REPOS_PATH:/data/repos}

# Push notifications
fcm:
  service-account-path: ${FCM_SERVICE_ACCOUNT_PATH:}
  project-id: ${FCM_PROJECT_ID:}
apns:
  key-path: ${APNS_KEY_PATH:}
  key-id: ${APNS_KEY_ID:}
  team-id: ${APNS_TEAM_ID:}
  bundle-id: ${APNS_BUNDLE_ID:}
  production: ${APNS_PRODUCTION:false}

# Logging
logging:
  level:
    com.docuvault: INFO
    org.springframework.security: INFO

---
spring:
  config:
    activate:
      on-profile: prod-tunnel
  datasource:
    url: jdbc:postgresql://localhost:5434/docuvault?sslmode=disable
    username: docuvault
    password: ${PROD_DB_PASSWORD}

encryption:
  key: ${ENCRYPTION_KEY}

git:
  repos-path: ${GIT_REPOS_PATH:/tmp/docuvault-repos}

---
spring:
  config:
    activate:
      on-profile: docker
  datasource:
    url: jdbc:postgresql://postgres:5432/docuvault
