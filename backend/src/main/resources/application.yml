spring:
  application:
    name: docuvault
  datasource:
    url: jdbc:postgresql://localhost:5433/docuvault
    username: ${DB_USERNAME:docuvault}
    password: ${DB_PASSWORD:docuvault}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
    show-sql: false
    open-in-view: false

  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          localhost: ${MAIL_SMTP_LOCALHOST:localhost}
          starttls:
            enable: true
            required: true

server:
  address: 0.0.0.0
  port: 7030
  servlet:
    context-path: /api
    session:
      cookie:
        name: DOCUVAULT_SESSION
        path: /api
        http-only: true
        same-site: strict
      timeout: 24h

# Encryption key for sensitive settings stored in database
encryption:
  key: ${ENCRYPTION_KEY:${JWT_SECRET:change-me-in-production}}

# OpenAI Configuration
openai:
  api-key: ${OPENAI_API_KEY:}
  embedding-model: text-embedding-3-small
  chat-model: gpt-4o

# GitLab Configuration
gitlab:
  url: ${GITLAB_URL:https://gitlab.com}
  token: ${GITLAB_TOKEN:}

# Admin Configuration
admin:
  email: ${ADMIN_EMAIL:}
  password: ${ADMIN_PASSWORD:}

# MinIO / S3 Configuration
minio:
  endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
  access-key: ${MINIO_ACCESS_KEY:docuvault}
  secret-key: ${MINIO_SECRET_KEY:docuvault123}
  bucket: space-logos

# Git Repository Storage
git:
  repos-path: ${GIT_REPOS_PATH:/data/repos}

# Logging
logging:
  level:
    com.docuvault: INFO
    org.springframework.security: INFO

---
spring:
  config:
    activate:
      on-profile: prod-tunnel
  datasource:
    url: jdbc:postgresql://localhost:5434/docuvault?sslmode=disable
    username: docuvault
    password: ${PROD_DB_PASSWORD}

encryption:
  key: ${ENCRYPTION_KEY}

git:
  repos-path: ${GIT_REPOS_PATH:/tmp/docuvault-repos}

---
spring:
  config:
    activate:
      on-profile: docker
  datasource:
    url: jdbc:postgresql://postgres:5432/docuvault
