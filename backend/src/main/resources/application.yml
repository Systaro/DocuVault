spring:
  application:
    name: docuvault
  datasource:
    url: jdbc:postgresql://localhost:5433/docuvault
    username: ${DB_USERNAME:docuvault}
    password: ${DB_PASSWORD:docuvault}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
    show-sql: false
    open-in-view: false

  flyway:
    # Auto-apply any V*.sql in classpath:db/migration on startup.
    # baseline-on-migrate=true + baseline-version=13 means existing installs
    # (which already have V001..V013 applied via bootstrap.sql or by hand)
    # get their flyway_schema_history table seeded at V013 on first boot —
    # so only V014+ runs against them. Fresh installs apply bootstrap.sql
    # first (which contains everything up to V013), then Flyway baselines.
    enabled: true
    baseline-on-migrate: true
    baseline-version: 13
    validate-on-migrate: true

  session:
    store-type: redis
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}
      password: ${SPRING_DATA_REDIS_PASSWORD:}

  mail:
    host: ${MAIL_HOST:mailrelay.systaro.de}
    port: ${MAIL_PORT:25}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
          localhost: ${MAIL_SMTP_LOCALHOST:docuvault.systaro.de}
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 100MB

app:
  # Public URL of this install — used in email links/logos. Falls back to
  # https://${PUBLIC_HOSTNAME} so customer installs only need PUBLIC_HOSTNAME.
  public-url: ${PUBLIC_URL:https://${PUBLIC_HOSTNAME:docuvault.systaro.de}}
  mail:
    from-address: ${MAIL_FROM_ADDRESS:noreply@docuvault.systaro.de}
    from-name: ${MAIL_FROM_NAME:DocuVault}
  meeting-bot:
    # Shared secret the standing meeting bot uses to poll for pending Teams
    # invites to dispatch into. Distinct from the per-invite dvm_ token: this
    # authorizes the service-level "what should I join?" list call. Leave blank
    # to disable Teams dispatch (the endpoint then rejects every request).
    dispatch-token: ${MEETING_BOT_DISPATCH_TOKEN:}

server:
  address: 0.0.0.0
  port: 7030
  forward-headers-strategy: native
  servlet:
    context-path: /api
    session:
      cookie:
        name: DOCUVAULT_SESSION
        path: /api
        http-only: true
        same-site: strict
        max-age: 30d
      timeout: 30d

# Encryption key for sensitive settings stored in database
encryption:
  key: ${ENCRYPTION_KEY:${JWT_SECRET:change-me-in-production}}

# OpenAI Configuration
openai:
  api-key: ${OPENAI_API_KEY:}
  embedding-model: text-embedding-3-small
  chat-model: gpt-4o

# GitLab Configuration
gitlab:
  url: ${GITLAB_URL:https://gitlab.com}
  token: ${GITLAB_TOKEN:}

# MinIO / S3 Configuration
minio:
  endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
  access-key: ${MINIO_ACCESS_KEY:docuvault}
  secret-key: ${MINIO_SECRET_KEY:docuvault123}
  bucket: space-logos

# Git Repository Storage
git:
  repos-path: ${GIT_REPOS_PATH:/data/repos}

# Push notifications
fcm:
  service-account-path: ${FCM_SERVICE_ACCOUNT_PATH:}
  project-id: ${FCM_PROJECT_ID:}
apns:
  key-path: ${APNS_KEY_PATH:}
  key-id: ${APNS_KEY_ID:}
  team-id: ${APNS_TEAM_ID:}
  bundle-id: ${APNS_BUNDLE_ID:}
  production: ${APNS_PRODUCTION:false}

# Logging
logging:
  level:
    com.docuvault: INFO
    org.springframework.security: INFO

# Central log shipping (logback -> logstash TCP). Empty = disabled (no shipping).
# Set LOGSTASH_DESTINATION=host:port (e.g. logs-new.systaro.de:5000) to enable.
# See logback-spring.xml.
logstash:
  destination: ${LOGSTASH_DESTINATION:}

---
spring:
  config:
    activate:
      on-profile: prod-tunnel
  datasource:
    url: jdbc:postgresql://localhost:5434/docuvault?sslmode=disable
    username: docuvault
    password: ${PROD_DB_PASSWORD}

encryption:
  key: ${ENCRYPTION_KEY}

git:
  repos-path: ${GIT_REPOS_PATH:/tmp/docuvault-repos}

---
spring:
  config:
    activate:
      on-profile: docker
  datasource:
    url: jdbc:postgresql://postgres:5432/docuvault
